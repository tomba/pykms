[build-system]
requires = ['setuptools >= 61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'pykms'
version = '0.1'

dependencies = [
  'pixutils @ git+https://github.com/tomba/pixutils.git',
]

requires-python = '>=3.10'
authors = [
  {name = 'Tomi Valkeinen', email = 'tomi.valkeinen@ideasonboard.com'},
]
maintainers = [
  {name = 'Tomi Valkeinen', email = 'tomi.valkeinen@ideasonboard.com'},
]
description = 'Pure-Python kms bindings'
readme = 'README.md'
license = {file = 'LICENSE.md'}
keywords = ['linux', 'kms', 'drm']
classifiers = [
  'Programming Language :: Python',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  'Development Status :: 4 - Beta',
  'Operating System :: POSIX :: Linux',
]

[project.urls]
Homepage = 'https://github.com/tomba/pykms'
Repository = 'https://github.com/tomba/pykms.git'
'Bug Tracker' = 'https://github.com/tomba/pykms/issues'

[tool.setuptools]
packages = ['kms', 'kms.uapi']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length = 100
extend-exclude = ['kms/uapi/']

[tool.ruff.lint]
extend-select = [
  'E',   # pycodestyle errors
  'W',   # pycodestyle warnings
  'F',   # Pyflakes: undefined/unused names, bad imports, f-string mistakes
  'FA',  # flake8-future-annotations: require `from __future__ import annotations`
  'Q',   # flake8-quotes: quote style, configured under lint.flake8-quotes below
  'UP',  # pyupgrade: rewrite idioms obsolete for our minimum Python
  'PLE', # Pylint errors: things that are outright broken
  'PLW', # Pylint warnings: suspicious but legal constructs
]
ignore = [
  'E741',  # ambiguous-variable-name: rejects `l`, `O`, `I` as names
  'E501',  # line-too-long
  'UP032', # f-string: rewrite `'{}'.format(x)` as an f-string
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401', 'F403']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double' # only 'double' is compatible with the formatter

[tool.ruff.format]
quote-style = 'single'

[project.optional-dependencies]
test = ['pytest']
utils = [
    'pyopengl',
    'numpy',
    'Pillow',
    'pyudev',
    # urwid 4.x containers type widget_list with structural protocols that
    # urwid's own widgets fail (WidgetMeta rebinds rows() with a signature
    # that doesn't match AbstractFlowWidget), breaking pyright. Pin until fixed.
    'urwid<4',
    'xcffib',
    'pygbm @ git+https://github.com/tomba/pygbm.git',
    'pixpat @ git+https://github.com/tomba/pixpat.git',
]
all = ['pykms[utils,test]']
